[package]
name = "real_ctrl"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "real_ctrl"
path = "src/main.rs"

[[bin]]
name = "real_ctrl_invoker_http_service"
path = "src/real_ctrl_invoker_http_service.rs"

[[bin]]
name = "real_ctrl_local_server"
path = "src/real_ctrl_local_server.rs"



[dependencies]
common = { path = "../common" }
ctrl_common = { path = "../ctrl_common" }
tokio = { version = "1.26.0", features = ["full"] }
bytes = { version = "1.4.0", features = ["serde"] }
tokio-stream = "0.1.14"
futures = "0.3.31"
tokio-util = { version = "0.7.8", features = ["full"] }
anyhow = "1.0.71"
rustyline = "12.0.0"
log = "0.4.20"
env_logger = "0.10.0"
uuid = { version = "1.4.1", features = ["v4"] }
sha2 = "0.10.9"
serde = "1.0.228"
serde_json = "1.0.149"
interprocess = { version = "2.4.0", features = ["async", "tokio"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc", "use-std"] }
chrono = "0.4.42"
spring = "0.4"
spring-web = "0.4"
tracing-subscriber = "0.3.22"
thiserror = "2.0.18"
percent-encoding = "2.3.2"
fs4 = { version = "0.6", features = ["tokio-async"] }