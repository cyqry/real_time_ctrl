[web]
binding = "0.0.0.0"    # 绑定地址
port = 9000            # 端口
graceful = true        # 优雅关闭
global_prefix = "/api" # 全局路由前缀（可选）

[web.middlewares.cors]
enable = true
allow_origins = ["*"]
allow_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]   # 建议加上 OPTIONS
allow_headers = ["Content-Type", "Authorization", "X-Requested-With"]  # 至少包含 Content-Type
max_age = 3600        # 可选，预检缓存时间（秒）

# 自定义配置
[custom]
app_name = "My Spring App"
version = "0.1.0"
