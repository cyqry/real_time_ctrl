[web]
# real_ctrl 的 HTTP API 默认只暴露给本机；需要远程访问时必须显式改配置并配置 REAL_CTRL_API_TOKEN。
binding = "127.0.0.1"
port = 9000
graceful = true
global_prefix = "/api"

[web.middlewares.cors]
enable = true
allow_origins = ["http://127.0.0.1:9000", "http://localhost:9000"]
allow_methods = ["GET", "POST", "OPTIONS"]
allow_headers = ["Content-Type", "Authorization", "X-Real-Ctrl-Token"]
max_age = 3600

[custom]
app_name = "real_ctrl"
version = "0.1.0"
