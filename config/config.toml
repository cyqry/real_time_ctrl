[web]
binding = "0.0.0.0"    # 绑定地址
port = 8080            # 端口
graceful = true        # 优雅关闭
global_prefix = "/api" # 全局路由前缀（可选）

[web.middlewares]
compression = { enable = true }
catch_panic = { enable = true }
logger = { enable = true, level = "info" }
cors = { enable = true, allow_origins = ["*"], allow_methods = ["GET", "POST", "PUT", "DELETE"] }

# 自定义配置
[custom]
app_name = "My Spring App"
version = "0.1.0"
