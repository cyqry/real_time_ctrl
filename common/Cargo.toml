[package]
name = "common"
version = "0.1.0"
edition = "2021"
build = "build.rs"

#整个项目构建时， 为确保build.rs只执行一次，所以只在这个公共模块设置build.rs
[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10.1"
sha2 = "0.10.9"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytes = { version = "1.4.0", features = ["serde"] }
tokio-util = { version = "0.7.8", features = ["full"] }
anyhow = "1.0.71"
tokio = { version = "1.26.0", features = ["full"] }
walkdir = "2"
rayon = "1.7.0"
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
chrono = "0.4.29"
chrono-tz = "0.8.3"
async-recursion = "1.0.5"
sha2 = "0.10.9"
aes-gcm = "0.10.1"
hex = "0.4.3"
futures = "0.3.31"
async-stream = "0.3.6"
# 0.23.45 修复 TLS 1.3 握手消息可能跨加密级别被错误接受的问题
#（RUSTSEC-2026-0285）。这里保留明确的安全下限，避免重新解析到存在漏洞的旧版。
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = "0.16"
hmac = "0.12.1"
rand = "0.8.5"
base64 = "0.22.1"
# ctrl_kik 使用 Noise NK：客户端匿名、服务端仅以固定 X25519 公钥证明持钥，
# 不传输证书、DNS 名称或服务器机器信息。只启用本项目实际使用的纯 Rust 算法。
snow = { version = "0.10.0", default-features = false, features = ["std", "default-resolver", "use-blake2", "use-chacha20poly1305", "use-curve25519", "use-getrandom"] }
string_obfuscation_macros = { path = "../string_obfuscation_macros" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Storage_FileSystem"] }
