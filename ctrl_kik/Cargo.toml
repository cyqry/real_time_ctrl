[package]
name = "ctrl_kik"
version = "0.1.0"
edition = "2021"

[features]
# 任意命令执行是高危能力，生产默认不编译；启用时服务端仍需单独授权。
dangerous-exec = []



[dependencies]
common = { path = "../common" }
tokio = { version = "1.26.0", features = ["full"] }
bytes = { version = "1.4.0", features = ["serde"] }
tokio-stream = "0.1.14"
tokio-util = { version = "0.7.8", features = ["full"] }
anyhow = "1.0.71"
log = "0.4.20"
env_logger = "0.10.0"
encoding_rs = "0.8.33"
chrono = "0.4.29"
image = "0.24.7"
scrap = "0.5"
fs4 = { version = "0.6", features = ["tokio-async"] }
uuid = { version = "1.4.1", features = ["v4", ] }
serde = "1.0.228"
serde_json = "1.0.149"
png = "=0.18.1"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(windows)'.dependencies]
whoami = "1.4.1"
winapi = {version="0.3.9",features = ["processthreadsapi", "winbase", "winnt","synchapi","wingdi","windef","winuser","handleapi"]}
