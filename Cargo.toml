[workspace]
members = [
    "real_ctrl",
    "ctrl_kik",
    "ctrl_server",
    "win_common",
    "common",
    "start",
    "ctrl_common",
    "screen_stream",
]
resolver = "2"

[profile.release]
# 保留既有 release 行为，避免影响当前分发流程。
strip = false
lto = true
opt-level = "z"

[profile.hardened]
# 生产发布建议使用：
# cargo build -p real_ctrl --profile hardened
# cargo build -p ctrl_server --profile hardened
# cargo build -p ctrl_kik --profile hardened
inherits = "release"
debug = 0
strip = "symbols"
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
opt-level = "z"
